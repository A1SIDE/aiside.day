name: Research request / 推荐研究对象
description: Suggest a product or business question to investigate / 推荐产品或商业问题
title: "[Research] "
body:
  - type: markdown
    attributes:
      value: |
        Which product or business question should AISIDE explore? English and Chinese are welcome.
        欢迎推荐值得研究的产品或问题。提交建议不代表已安排收录或发布时间。
  - type: input
    id: subject
    attributes:
      label: Product or research topic / 产品或研究主题
      placeholder: Product name, business model or customer problem
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Product website / 产品网站
      description: Optional for broader research topics.
      placeholder: https://...
  - type: textarea
    id: question
    attributes:
      label: What would you like to understand? / 你希望了解什么？
      description: For example, who pays, how customers find it, or how the service is delivered.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Why this is worth exploring / 推荐理由与资料
      description: Optional. Add public sources and mention if you are the maker or affiliated with the product.
