name: Content correction / 内容纠错
description: Report an outdated claim, broken source or translation issue / 事实、来源或翻译纠错
title: "[Correction] "
body:
  - type: markdown
    attributes:
      value: |
        Help us keep AISIDE's research useful and accurate. English and Chinese are welcome.
        欢迎指出事实、数据、来源链接或翻译中的问题，并附上可核实的依据。
  - type: input
    id: page
    attributes:
      label: Report or page URL / 报告或页面链接
      placeholder: https://aiside.day/en/reports/...
    validations:
      required: true
  - type: textarea
    id: passage
    attributes:
      label: What needs correction? / 需要更正的内容
      description: Identify the section or quote a short relevant passage.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction / 建议更正为
      description: Explain what has changed or why the current wording is inaccurate.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Supporting sources / 参考依据
      description: Add public source links and dates where available. If a source is unavailable, explain how the claim can be checked.
    validations:
      required: true
